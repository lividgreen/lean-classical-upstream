name = "classical_upstream"
version = "0.5.0"
keywords = ["math", "algorithmic-information-theory", "learning-theory", "ergodic-theory", "realizability"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "Foundation"
git = "https://github.com/FormalizedFormalLogic/Foundation"
rev = "fbcfee52cb4a892087fa978366282a9ebd844f29"

[[require]]
name = "cslib-frontier"
git = "https://github.com/cslib-community/cslib-frontier"
rev = "13929006ffbd7ee8f4bb368a5bfa72638d53101d"

# Last on purpose: a shared package takes its revision from the last require that pins it, and
# `cslib-frontier` and the `cslib` it pins sit on a newer Lean than Mathlib's here.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# In every library below the glob includes the root itself (`<Root>.*` matches the root and its
# submodules, `<Root>.+` would exclude the root): Lake only counts a root that some glob matches,
# and doc-gen4 documents the roots and their import closure, so a missed root gives empty docs.
[[lean_lib]]
name = "CodeLayer"
roots = ["CodeLayer"]
globs = ["CodeLayer.*"]

[[lean_lib]]
name = "AIT"
roots = ["AIT"]
globs = ["AIT.*"]

[[lean_lib]]
name = "ChaitinIncompleteness"
roots = ["ChaitinIncompleteness"]
globs = ["ChaitinIncompleteness.*"]

[[lean_lib]]
name = "Learning"
roots = ["Learning"]
globs = ["Learning.*"]

[[lean_lib]]
name = "AnytimeValid"
roots = ["AnytimeValid"]
globs = ["AnytimeValid.*"]

[[lean_lib]]
name = "ErgodicTheory"
roots = ["ErgodicTheory"]
globs = ["ErgodicTheory.*"]

[[lean_lib]]
name = "Realizability"
roots = ["Realizability"]
globs = ["Realizability.*"]

[[lean_lib]]
name = "ShannonInfo"
roots = ["ShannonInfo"]
globs = ["ShannonInfo.*"]

[[lean_lib]]
name = "Combinatorics"
roots = ["Combinatorics"]
globs = ["Combinatorics.*"]
